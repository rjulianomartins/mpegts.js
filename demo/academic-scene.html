<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Academic Scene MSE</title>
    <style>
        body { margin: 20px; font-family: sans-serif; background: #111; color: #eee; }
        video { display: block; width: min(1100px, 100%); background: #000; }
        .panel { margin-top: 12px; max-width: 1100px; display: grid; gap: 8px; }
        .row { display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 7px; }
        button { padding: 7px 12px; }
        pre { white-space: pre-wrap; background: #181818; padding: 10px; min-height: 90px; }
    </style>
</head>
<body>
    <h2>Academic Scene MSE</h2>
    <video id="video" controls playsinline></video>
    <div class="panel">
        <div class="row">
            <input id="manifest" value="academic-scene-manifest.example.json">
            <button id="load">Load</button>
            <button id="play">Play</button>
            <button id="titles">Scene titles</button>
        </div>
        <div>Native timeline = compilation timeline. Left/Right Arrow = previous/next Scene.</div>
        <pre id="status">Idle</pre>
    </div>
    <script src="../dist/academic-scene-mse.js"></script>
    <script>
        var player = null;
        var video = document.getElementById('video');
        var status = document.getElementById('status');
        var titlesVisible = false;

        function show(data) {
            status.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        document.getElementById('load').onclick = function () {
            if (player) {
                player.destroy();
            }
            player = new AcademicSceneMSE.SceneCompositionPlayer({
                type: 'scenes',
                url: document.getElementById('manifest').value
            }, {
                keyboardSceneNavigation: true,
                showSceneTitles: titlesVisible,
                preloadAheadSeconds: 45,
                preloadNextSceneThreshold: 25,
                preloadNextSceneSeconds: 12
            });
            player.on(AcademicSceneMSE.Events.READY, function (event) { show({event: 'ready', data: event}); });
            player.on(AcademicSceneMSE.Events.SCENE_CHANGE, function (event) { show({event: 'scene', data: event}); });
            player.on(AcademicSceneMSE.Events.TIME_UPDATE, function (event) { show({event: 'time', data: event}); });
            player.on(AcademicSceneMSE.Events.ERROR, function (event) { show({event: 'error', data: event}); });
            player.attachMediaElement(video);
            player.load();
        };

        document.getElementById('play').onclick = function () {
            if (player) {
                player.play();
            }
        };

        document.getElementById('titles').onclick = function () {
            titlesVisible = !titlesVisible;
            if (player) {
                player.setSceneTitleVisibility(titlesVisible);
            }
        };
    </script>
</body>
</html>
